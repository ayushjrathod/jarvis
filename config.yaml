# Mission Control — single config file
# Paths are relative to this file's directory unless absolute.

dispatcher:
  host: 127.0.0.1
  port: 8765
  db: data/mission.db
  queue_dir: queue
  poll_interval_s: 5
  queue_max_retries: 3   # transient ingest failures retried this many polls before .failed
  max_concurrent_agentic: 2

  # The claude aliases only exist in interactive zsh — invoke the binary directly.
  claude_bin: /home/ayra/.local/bin/claude
  claude_config_dir: /home/ayra/.claude-per

  # Ask-about-my-screen: portal screenshots stored + served from here
  # (GET /screenshots/<name>, pruned by jarvis.ask_screen keep_last), and a
  # server-side Whisper instance for browser mic uploads (POST /stt).
  screenshots_dir: data/screenshots
  stt: { model: small.en, compute: int8, language: en }

  models:
    # quick path (claude -p stream-json, subscription login)
    quick: claude-sonnet-5
    # explicit so dispatcher runs don't inherit the CLI default (~/.claude-per settings)
    agentic: claude-sonnet-5
    # passed as --effort on all claude -p runs (quick + agentic)
    effort: medium
    # refusal fallback (locked decision #3)
    fallback: claude-opus-4-8
    # (no `classifier:` key — dispatcher/classifier.py is pure heuristic and
    #  never asked a model; the key was never read. Removed 2026-08-02.)
    # Internal plumbing tasks (a NOTIFY/SKIP verdict, a schedule spec, search
    # words) run here instead of models.quick — each is a classification with
    # mechanical validation downstream, and the rate difference is the whole
    # cost of these runs: measured $0.103 sonnet vs $0.028 haiku per gate call.
    # Clear this key to send them back to models.quick.
    meta: claude-haiku-4-5
    meta_task_types: [notify-gate, automation-parse, media-parse]

  # The quick path runs `claude -p` on the **Claude Code subscription login**
  # (claude_config_dir above). The Anthropic Messages API backend was removed
  # 2026-07-27 — the user is not funding an API key, and a key in the
  # environment would make the CLI abandon the subscription for it
  # (runner.cli_env strips them from every subprocess for that reason).

  # Quick-path conversation continuity: a follow-up within this
  # window resumes the previous claude session (`claude -p --resume`), so
  # "what about tomorrow?" keeps context. Tracked per source (voice/api/…);
  # 0 disables — every turn starts fresh. Idle-freshness pattern per openclaw
  # src/config/sessions/reset-policy.ts.
  quick_session_idle_minutes: 10

  # Note: a bare `claude -p` invocation carries ~$0.15-0.25 of notional cost
  # (Claude Code system prompt overhead), so caps below that always trip.
  budgets:
    max_cost_per_task_usd: 3.00   # passed to claude -p --max-budget-usd
    quick_max_cost_usd: 1.00
    timeout_s: 600                # wall-clock kill for AGENTIC runs (claude -p headless)
    # ...and the quick path's own kill, which is a different number on a
    # different code path (quick.py) — raising timeout_s above does nothing for
    # it. It was read with a hardcoded 120s default and never shipped here, so a
    # slow turn (a big screenshot read, a long resumed session) died at an
    # invisible deadline with `error: timeout` (surfaced 2026-08-10). Note the
    # synchronous /memory/reconcile blocks on a quick call, so its client-side
    # timeout in scripts/run_memory_reconcile.py must stay comfortably above this.
    quick_timeout_s: 120
    transient_retry_delay_s: 2    # backoff before the one retry on spawn/timeout error

  # Trust boundary (mechanical, not conventional). Only server-internal spawns
  # (reflection, notify gate, consolidation, graph, learn, requeue) may widen a
  # task's tools/budget or inject a resume session via metadata; external
  # sources (api/queue/voice/ui/screen) can NARROW but never widen. Areas listed
  # here may declare Bash / unscoped Edit-Write in their SKILL.md frontmatter;
  # every other area has those grants stripped at load time. Keep empty unless
  # an area genuinely needs shell/unrestricted-write access.
  security:
    privileged_areas: []
    # Phone access (see future/phone-access-and-feature-gaps.md, Tailscale
    # chosen). Front-door hostnames BESIDES loopback that the CSRF origin guard
    # should trust for same-origin SPA POSTs — the dashboard loaded over
    # Tailscale Serve sends its own POSTs with that Origin, and the guard would
    # otherwise 403 them. Add your tailnet name here, e.g.
    #   public_hosts: ["your-box.your-tailnet.ts.net"]
    # (scripts/setup_tailscale.sh prints the exact line). This is ONLY the
    # origin allowlist, NOT authentication: Tailscale is the access control —
    # the dispatcher stays on 127.0.0.1 and Serve proxies HTTPS in front, so no
    # public port is opened and no token middleware is needed.
    public_hosts: ["archlinux.tail79c6ce.ts.net"]
    # Whether an EXTERNAL caller may set metadata.simulate_refusal, which forces
    # the refusal fallback — i.e. a SECOND run of the same task on
    # models.fallback (an Opus). It is a test seam; leaving it reachable let
    # anything that could POST /task (dashboard, phone over Tailscale, a queue
    # file) double the cost of every agentic run (found 2026-08-08). Turn it on
    # only while running scripts/smoke_phase_a.sh, then turn it back off.
    allow_simulate_refusal: false

  task_defaults:
    allowed_tools: [Read, Glob, Grep]   # read-only baseline for unattended runs

  task_types:
    summarize:
      # Path-scoped to the vault: a summary writer has no business touching
      # source, config, or systemd units (M4).
      # `Edit(path/**)` is what actually grants the **Write** tool — a bare
      # `Write(path/**)` rule is silently ignored and the write is denied
      # (same caveat the daily-brief agent documents; verified again
      # 2026-07-27 with a direct CLI probe). Scoping this to Write(vault/**)
      # alone in session 13 broke the summarize task type, and session 17's
      # denial detection is what finally surfaced it.
      allowed_tools: [Read, Glob, Grep, "Edit(vault/**)", "Write(vault/**)"]

  # Daily brief: on a day with no open tasks and no notes touched in the last
  # quiet_notes_days, scripts/run_agent.py writes the brief itself and never
  # calls a model (it would spend ~$0.40 and 8-11 turns to say "clean slate").
  # Set skip_model_when_quiet: false to always run the agent.
  brief:
    skip_model_when_quiet: true
    quiet_notes_days: 3

  # Memory (Phase F): raw episode capture + always-in-context blocks + vault
  # search index. Blocks are plain markdown in blocks_dir — edit them freely;
  # budgets are chars (~4 per token), enforced at prompt-build time.
  memory:
    capture: true                  # log settled interactions to the episodes table
    capture_exclude_sources: []    # sources never captured, e.g. [smoke]
    blocks_dir: vault/memory
    block_budgets:
      USER.md: 2000
      MEMORY.md: 3200
    index_dirs: [vault]            # ingest walks these for /memory/search
    reindex_on_start: true
    # When Claude's plan-wide session cap is hit, a quick question falls back
    # to the local hybrid index and answers EXTRACTIVELY — verbatim quotes with
    # the source file named, no generation — instead of only reporting the
    # outage and going dead until the window resets (which is what happened in
    # sessions 7 and 10). Internal plumbing sources are excluded: a machine
    # task wants a real failure, not a consolation paragraph. This is also the
    # seam a local model would plug into later.
    offline_fallback: true
    # Knowledge graph (Phase J2/J3): nightly fact extraction rides the
    # consolidation export; weekly reconcile timer invalidates duplicates/
    # contradictions (never deletes). Facts surface in /memory/search.
    graph:
      enabled: true

  # Local embeddings (Phase J1): fastembed bge-small int8 ONNX (~34MB, first
  # use downloads into data/models/fastembed) + sqlite-vec in mission.db.
  # /memory/search becomes hybrid FTS+vector fused by RRF; new entries and
  # episodes are embedded at startup, after reindex, and every
  # refresh_minutes. enabled: false (or a missing sqlite-vec) = FTS-only.
  embeddings:
    enabled: true
    model: BAAI/bge-small-en-v1.5   # 384-dim; db vec tables must agree
    refresh_minutes: 15

  # Learning loop (Phase G): a complex agentic run (>= min turns) triggers a
  # reflection fork that resumes the run's own CLI session with areas/**-scoped
  # edit tools and patches/creates skills (hermes-agent review pattern, MIT).
  # The deterministic curator ages unused areas active -> stale -> archived
  # (moved to areas/.archive/, recoverable); protected/pinned/timer areas are
  # exempt, as are never-used areas younger than the stale window.
  learning:
    reflection: true
    # num_turns >= this queues a reflection. Was 12, which measured out at 5 of
    # 83 agentic runs ever (6%) — the loop worked but almost never fired, since
    # the daily brief lands at 8-11 turns and sat just under the bar. At 8 it is
    # 41% of historical runs (2026-08-11).
    reflection_min_turns: 8
    # Task types excluded on top of the hard-coded meta set in reflection.py.
    # The timer agents are here because they are the same prompt over the same
    # vault every day: at the threshold above they would spawn a ~$0.21 review
    # of "I wrote today's brief" daily, almost always concluding there is
    # nothing to save. Delete this key to reflect on them too; the meta types
    # (reflection/memory-consolidate/learn) can't be re-enabled from here on
    # purpose — that's the recursion guard.
    no_reflect_extra: [daily-brief, weekly-review]
    reflection_max_cost_usd: 1.00  # budget cap for the reflection run
    curator:
      stale_after_days: 30
      archive_after_days: 90       # stale this long -> areas/.archive/
      protected: [tasks, memory, learn]

  # Standing automations (Phase I, khoj automations pattern — patterns only,
  # AGPL): "every morning, tell me X" → automations table row; an in-dispatcher
  # scheduler submits due rows as normal tasks (source=automation). nl_detect
  # diverts schedule-phrased /task texts into automation creation (one LLM
  # parse, then mechanical validation). notify_gate: finished automation/timer
  # results pass a quick LLM judgment on models.meta (cheap)
  # before being surfaced; SKIP = logged only, and internal task types
  # (reflection, consolidation) are never announced. An empty/absent block
  # disables the whole feature.
  automations:
    enabled: true
    nl_detect: true
    check_interval_s: 30
    notify_gate: true
    notify_sources: [automation, timer]
    notify_desktop: true          # notify-send, if installed

  # Media control: "play bohemian rhapsody" / "pause" / "skip" / "what's
  # playing" / "volume 40" drive the local Spotify desktop client over MPRIS
  # (D-Bus) instead of reaching Claude — deterministic, sub-second, free.
  # Finding a song by name is the one thing MPRIS can't do, so it costs one
  # Spotify Web API search under the client-credentials flow (app-only auth:
  # no user OAuth, no Premium needed — playback happens in your own client).
  # llm_fallback: vague-but-musical phrasing ("put on something chill") gets a
  # single media-parse call that picks SEARCH WORDS only; the action itself is
  # always deterministic. An empty/absent block disables the whole feature.
  media:
    enabled: true
    nl_detect: true               # divert music phrasing in POST /task (mode=auto)
    llm_fallback: true
    # (no `player:` key — it read like a swappable player selector but nothing
    #  ever loaded it: the MPRIS bus name is hardcoded to
    #  org.mpris.MediaPlayer2.spotify in dispatcher/spotify.py, so `player: vlc`
    #  silently changed nothing. Same dead-config class as `models.classifier`,
    #  removed 2026-08-02. Removed 2026-08-10; wiring the key through to
    #  BUS_NAME/launch_cmd is the alternative if a second player is ever wanted.)
    launch_cmd: ["flatpak", "run", "com.spotify.Client"]
    credentials: data/spotify.json   # written by scripts/setup_spotify.sh, gitignored
    market: IN
    search_limit: 5

  # Event-driven proactivity: react to a file landing in vault/inbox/ rather
  # than only to the clock. Polling (the dispatcher already polls for two other
  # things, and a minute of latency is irrelevant for "I saved a file");
  # a file fires only once its mtime+size are unchanged across two consecutive
  # checks, so a large PDF still being written isn't indexed at half length.
  # Files already present at startup are recorded, not announced.
  inbox:
    enabled: true
    dir: vault/inbox
    check_interval_s: 60
    notify: true       # desktop + SSE "Indexed report.pdf — searchable now."
    # Opt-in: also spend one quick call per new file to say what it is.
    # Off by default — arrival + indexing is free, a summary is not.
    summarize: false
    # ...and cap the fan-out. This directory is one the user SYNCS into, so a
    # single poll can surface fifty files at once; uncapped that was fifty cold
    # `claude -p` calls, serialized, at the ~$0.10-0.14 floor (found
    # 2026-08-08). Overflow is logged and named in the notification, never
    # dropped silently. 0 = index but never spend a model.
    summarize_max_per_poll: 5

  # Desktop control (computer-use tiers T1+T2 — see future/computer-use.md).
  # Deterministic verbs only: no pixels, no coordinates, no synthetic input,
  # and no new dependencies (wpctl / gtk-launch / xdg-open / wl-copy /
  # loginctl were all already installed; windows ride AT-SPI over jeepney,
  # browser tabs ride DevTools HTTP plus a stdlib-socket WS client).
  # Set enabled: false to turn the whole surface off — every verb then denies
  # and POST /desktop 503s.
  #
  # Window list/focus shipped 2026-09-08 after the 2026-07-26 spike proved
  # only the GNOME Shell route unreachable (AT-SPI was always there); screen
  # brightness stays out (no gsd Screen interface; the sysfs node is
  # root-owned — needs brightnessctl).
  computer:
    enabled: true
    nl_detect: true               # divert desktop phrasing in POST /task (mode=auto)
    confirm_timeout_s: 120        # unanswered confirmations expire (then deny)
    # allow → run it; confirm → ask first (SSE `confirm` event + /desktop/confirm);
    # deny → refuse with a spoken reason. Unknown verbs and unknown values deny.
    # clipboard_get and open default to confirm: the clipboard routinely holds
    # passwords, and an arbitrary URL is both an exfiltration channel and the
    # obvious prompt-injection payload. focus/activate_tab/read_tab confirm
    # for the same reason (context switches and third-party page text). The
    # rest are reversible and low-stakes, and confirming "system volume 40"
    # by voice every time would be worse UX than not having the feature.
    policy:
      status: allow
      volume: allow
      mute: allow
      lock: allow
      launch: allow
      clipboard_set: allow
      windows: allow
      tabs: allow
      clipboard_get: confirm
      open: confirm
      focus: confirm
      activate_tab: confirm
      read_tab: confirm

  # Browser tabs (computer-use tier T3). Zero new deps; the browser side must
  # run with --remote-debugging-port (default 9222) or every call fails fast
  # and speakably instead of hanging the divert.
  browser:
    debug_port: 9222

  # (no `prices:` block — it fed Config.quick_cost, which priced the Messages
  #  API's token counts by hand. That backend was removed 2026-07-27 and every
  #  run now reports its own total_cost_usd, so both were dead. Removed
  #  2026-08-02.)

jarvis:
  # Where the voice pipeline (and jarvis.ask_screen) reaches the dispatcher.
  # Left commented because the default is derived from dispatcher.host/port
  # above — but it IS read (jarvis/config.py), so it was an invisible override
  # nobody could discover from this file (surfaced 2026-08-10). Uncomment only
  # to point Jarvis at a dispatcher somewhere else; the two are not otherwise
  # linked, so a changed dispatcher.port is picked up here automatically.
  # dispatcher_url: http://127.0.0.1:8765
  trigger_key: KEY_F9          # dictation (mission-dictate): hold → typed at cursor
  ptt_key: KEY_RIGHTCTRL       # assistant hold-to-talk (mission-jarvis): hold → ask
                               # must differ from trigger_key — both watch raw evdev
  ptt_beep_ms: 90              # feedback beeps on press/release (0 disables)
  sample_rate: 16000
  wake_word: hey_jarvis        # stock openWakeWord model name
  wake_threshold: 0.2            # tuned from near-miss logs: user's natural "hey jarvis" scores 0.21-0.25
                                 # on the stock model; raise if false wakes appear (journal shows scores)
  wake_prebuffer_ms: 400       # rolling audio kept before wake fires, spliced onto capture
  wake_beep_ms: 120            # fallback beep on wake (used only if wake_ack_phrases is [])
  wake_ack_phrases: ["Hmm?", "Yes?"]   # spoken wake acknowledgment, random pick
  stt:
    engine: faster_whisper
    model: small.en
    compute: int8
  tts:
    engine: piper
    voice: en_US-lessac-medium # Kokoro-82M drops in here later (TTSEngine ABC)
  # VAD endpointing + barge-in (32ms frames)
  vad_threshold: 0.5
  endpoint_silence_ms: 900     # stop capture after this much trailing silence
  max_utterance_s: 30
  mic_lost_after_s: 5          # re-open the mic after this many seconds of no audio (device died mid-stream)
  max_recording_s: 300         # hard cap on one push-to-talk recording (guards a wedged trigger key)
  barge_in_frames: 6           # 6 x 32ms ≈ 192ms of speech cuts TTS + aborts call
  # Ask-about-my-screen: GNOME shortcut -> python -m jarvis.ask_screen
  # (portal area-select screenshot -> chromium --app popup on the dispatcher).
  # Re-run scripts/setup_ask_screen.sh after changing the shortcut.
  ask_screen:
    shortcut: "<Super><Alt>a"
    window_size: [520, 720]
    keep_last: 20              # screenshots kept in data/screenshots
    chromium_bin: chromium
