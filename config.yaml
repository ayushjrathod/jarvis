# Mission Control — single config file
# Paths are relative to this file's directory unless absolute.

dispatcher:
  host: 127.0.0.1
  port: 8765
  db: data/mission.db
  queue_dir: queue
  poll_interval_s: 5
  queue_max_retries: 3   # transient ingest failures retried this many polls before .failed
  max_concurrent_agentic: 2

  # The claude aliases only exist in interactive zsh — invoke the binary directly.
  claude_bin: /home/ayra/.local/bin/claude
  claude_config_dir: /home/ayra/.claude-per

  # Ask-about-my-screen: portal screenshots stored + served from here
  # (GET /screenshots/<name>, pruned by jarvis.ask_screen keep_last), and a
  # server-side Whisper instance for browser mic uploads (POST /stt).
  screenshots_dir: data/screenshots
  stt: { model: small.en, compute: int8, language: en }

  models:
    # quick path: Messages API when credentials exist, else claude -p stream-json
    quick: claude-sonnet-5
    # explicit so dispatcher runs don't inherit the CLI default (~/.claude-per settings)
    agentic: claude-sonnet-5
    # passed as --effort on all claude -p runs (quick CLI backend + agentic)
    effort: medium
    # refusal fallback (locked decision #3)
    fallback: claude-opus-4-8
    classifier: claude-haiku-4-5

  # messages_api | claude_cli | auto (auto: messages_api if API credentials found)
  quick_backend: auto

  # Quick-path conversation continuity (CLI backend): a follow-up within this
  # window resumes the previous claude session (`claude -p --resume`), so
  # "what about tomorrow?" keeps context. Tracked per source (voice/api/…);
  # 0 disables — every turn starts fresh. Idle-freshness pattern per openclaw
  # src/config/sessions/reset-policy.ts.
  quick_session_idle_minutes: 10

  # Note: a bare `claude -p` invocation carries ~$0.15-0.25 of notional cost
  # (Claude Code system prompt overhead), so caps below that always trip.
  budgets:
    max_cost_per_task_usd: 3.00   # passed to claude -p --max-budget-usd
    quick_max_cost_usd: 1.00
    timeout_s: 600                # wall-clock kill for agentic runs
    quick_max_tokens: 1024
    transient_retry_delay_s: 2    # backoff before the one retry on spawn/timeout error

  task_defaults:
    allowed_tools: [Read, Glob, Grep]   # read-only baseline for unattended runs

  task_types:
    summarize:
      allowed_tools: [Read, Glob, Grep, Write]

  # Memory (Phase F): raw episode capture + always-in-context blocks + vault
  # search index. Blocks are plain markdown in blocks_dir — edit them freely;
  # budgets are chars (~4 per token), enforced at prompt-build time.
  memory:
    capture: true                  # log settled interactions to the episodes table
    capture_exclude_sources: []    # sources never captured, e.g. [smoke]
    blocks_dir: vault/memory
    block_budgets:
      USER.md: 2000
      MEMORY.md: 3200
    index_dirs: [vault]            # ingest walks these for /memory/search
    reindex_on_start: true

  # Learning loop (Phase G): a complex agentic run (>= min turns) triggers a
  # reflection fork that resumes the run's own CLI session with areas/**-scoped
  # edit tools and patches/creates skills (hermes-agent review pattern, MIT).
  # The deterministic curator ages unused areas active -> stale -> archived
  # (moved to areas/.archive/, recoverable); protected/pinned/timer areas are
  # exempt, as are never-used areas younger than the stale window.
  learning:
    reflection: true
    reflection_min_turns: 12      # num_turns >= this queues a reflection
    reflection_max_cost_usd: 1.00  # budget cap for the reflection run
    curator:
      stale_after_days: 30
      archive_after_days: 90       # stale this long -> areas/.archive/
      protected: [tasks, memory, learn]

  # Standing automations (Phase I, khoj automations pattern — patterns only,
  # AGPL): "every morning, tell me X" → automations table row; an in-dispatcher
  # scheduler submits due rows as normal tasks (source=automation). nl_detect
  # diverts schedule-phrased /task texts into automation creation (one LLM
  # parse, then mechanical validation). notify_gate: finished automation/timer
  # results pass a quick LLM judgment (resumes the run's session — cheap)
  # before being surfaced; SKIP = logged only, and internal task types
  # (reflection, consolidation) are never announced. An empty/absent block
  # disables the whole feature.
  automations:
    enabled: true
    nl_detect: true
    check_interval_s: 30
    notify_gate: true
    notify_sources: [automation, timer]
    notify_desktop: true          # notify-send, if installed

  # USD per million tokens, for quick-path cost computation (agentic cost comes
  # from the CLI's total_cost_usd). Cached from docs 2026-07-05.
  prices:
    claude-fable-5:   { input: 10.0, output: 50.0 }
    claude-opus-4-8:  { input: 5.0,  output: 25.0 }
    claude-sonnet-5:  { input: 3.0,  output: 15.0 }
    claude-haiku-4-5: { input: 1.0,  output: 5.0 }

jarvis:
  trigger_key: KEY_F9
  sample_rate: 16000
  wake_word: hey_jarvis        # stock openWakeWord model name
  wake_threshold: 0.2            # tuned from near-miss logs: user's natural "hey jarvis" scores 0.21-0.25
                                 # on the stock model; raise if false wakes appear (journal shows scores)
  wake_prebuffer_ms: 400       # rolling audio kept before wake fires, spliced onto capture
  wake_beep_ms: 120            # fallback beep on wake (used only if wake_ack_phrases is [])
  wake_ack_phrases: ["Hmm?", "Yes?"]   # spoken wake acknowledgment, random pick
  stt:
    engine: faster_whisper
    model: small.en
    compute: int8
  tts:
    engine: piper
    voice: en_US-lessac-medium # Kokoro-82M drops in here later (TTSEngine ABC)
  # VAD endpointing + barge-in (32ms frames)
  vad_threshold: 0.5
  endpoint_silence_ms: 900     # stop capture after this much trailing silence
  max_utterance_s: 30
  barge_in_frames: 6           # 6 x 32ms ≈ 192ms of speech cuts TTS + aborts call
  # Ask-about-my-screen: GNOME shortcut -> python -m jarvis.ask_screen
  # (portal area-select screenshot -> chromium --app popup on the dispatcher).
  # Re-run scripts/setup_ask_screen.sh after changing the shortcut.
  ask_screen:
    shortcut: "<Super><Alt>a"
    window_size: [520, 720]
    keep_last: 20              # screenshots kept in data/screenshots
    chromium_bin: chromium
